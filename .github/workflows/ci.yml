name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npx --no-install tsc --project vender/cloud189-sdk/tsconfig.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and test
        run: npm run check
